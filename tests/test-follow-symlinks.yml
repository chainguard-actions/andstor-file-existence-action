name: Test follow_symbolic_links option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a symlink to a real file
        run: |
          ln -sf "$GITHUB_WORKSPACE/tests/test-file-not-found.yml" "$GITHUB_WORKSPACE/tests/symlink-target.yml"
      - id: action-follow
        uses: .
        with:
          files: "tests/symlink-target.yml"
          follow_symbolic_links: "true"
      - name: Assert files_exists is true when following symlinks
        env:
          ACTUAL: ${{ steps.action-follow.outputs.files_exists }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' when following symlinks, but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Cleanup symlink
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/tests/symlink-target.yml"
