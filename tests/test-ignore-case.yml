name: Test ignore_case option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-ignore-case
        uses: .
        with:
          files: "tests/fixtures/testcasefile.txt"
          ignore_case: "true"
      - name: Assert files_exists is true with ignore_case
        env:
          ACTUAL: ${{ steps.action-ignore-case.outputs.files_exists }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true' with ignore_case=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
